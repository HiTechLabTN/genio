<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" rx="160" fill="#080c16"/>
  <rect x="25" y="25" width="750" height="750" rx="140" fill="none" stroke="#1e293b" stroke-width="4"/>
  <polygon points="400,120 640,240 640,530 400,680 160,530 160,240" fill="#0f172a" stroke="url(#cyber)" stroke-width="8" filter="url(#glow)"/>
  <path d="M 230,290 Q 400,240 570,290 L 550,440 Q 400,490 250,440 Z" fill="#030712" stroke="#00f0ff" stroke-width="4"/>
  <ellipse cx="325" cy="365" rx="45" ry="18" fill="url(#cyber)" filter="url(#glow)"/>
  <ellipse cx="475" cy="365" rx="45" ry="18" fill="url(#cyber)" filter="url(#glow)"/>
  <ellipse cx="325" cy="365" rx="20" ry="8" fill="#ffffff"/>
  <ellipse cx="475" cy="365" rx="20" ry="8" fill="#ffffff"/>
  <line x1="400" y1="120" x2="400" y2="55" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="400" cy="50" r="14" fill="#e11d48" filter="url(#glow)"/>
  <line x1="330" y1="530" x2="470" y2="530" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="355" y1="555" x2="445" y2="555" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
