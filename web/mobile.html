<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Genio — المهندس الذاتي المستقل</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00f0ff">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #060911; color: #e2e8f0; font-family: 'Cairo', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .hud-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(0, 240, 255, 0.25); }
    .glow-cyan { text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }
    .jarvis-listening { animation: pulse-cyan 1.5s infinite; }
    @keyframes pulse-cyan {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
      50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <nav class="hud-card sticky top-0 z-50 border-b border-cyan-500/30 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div id="status-orb" class="w-3.5 h-3.5 rounded-full bg-cyan-400 animate-ping"></div>
      <div>
        <span class="text-xl font-black text-cyan-400 tracking-wider glow-cyan mono">Genio .</span>
        <span class="text-[10px] text-cyan-500 font-bold block -mt-1">المهندس الذاتي المستقل</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="wake-toggle-btn" onclick="toggleWakeWord()" class="px-3 py-1.5 bg-cyan-950 border border-cyan-500/40 text-cyan-300 text-xs rounded-xl font-bold transition">
        🎙️ استيقاظ: Hey Genio
      </button>
      <button id="tts-btn" onclick="toggleTTS()" class="px-2.5 py-1.5 bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-xl">
        🔊
      </button>
    </div>
  </nav>

  <section class="max-w-4xl mx-auto px-4 pt-3 pb-1 w-full grid grid-cols-3 gap-2 text-center text-xs">
    <div class="hud-card p-2 rounded-xl">
      <div class="text-gray-400 text-[10px]">حرارة كارت الشاشة</div>
      <div class="text-cyan-400 font-bold text-sm mono">38°C</div>
    </div>
    <div class="hud-card p-2 rounded-xl">
      <div class="text-gray-400 text-[10px]">ذاكرة VRAM الفارغة</div>
      <div class="text-emerald-400 font-bold text-sm mono">6.9 GB</div>
    </div>
    <div class="hud-card p-2 rounded-xl">
      <div class="text-gray-400 text-[10px]">حالة السيرفر</div>
    </div>
  </section>

  <main class="max-w-4xl mx-auto px-4 py-3 w-full flex-1 flex flex-col space-y-3">
    <div id="chat-container" class="hud-card rounded-2xl flex-1 flex flex-col overflow-hidden border border-cyan-500/30 min-h-[420px]">
      <div class="bg-slate-950 px-4 py-2 border-b border-cyan-500/20 text-xs text-cyan-400 font-mono flex items-center justify-between">
        <span class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400"></span> JARVIS_ENGINE [ONLINE]
        </span>
        <span id="wake-status" class="text-slate-400 text-[11px]">قل: 'Hey Genio' أو 'يا جينيو'</span>
      </div>

      <div id="chat-stream" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="hud-card p-3 rounded-xl border-l-4 border-cyan-400">
          <span class="text-[10px] text-cyan-400 font-mono">[GENIO]</span>
          <p class="text-sm mt-1 text-slate-200">
            على سلامتك يا عزمي! أنا جينيو مهندس الـ AI والبنية التحتية متاعك. احكي معايا ديريكت بالصوت وإلا ناديني 'Hey Genio' وتو نجاوبك في البلاصة!
          </p>
        </div>
      </div>

      <div class="p-3 bg-slate-950 border-t border-cyan-500/20 flex gap-2">
        <input id="prompt-input" type="text" placeholder="احكي معاه بالدارجة لهنا أو ناديه صوتياً..." 
               class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-cyan-400"
               onkeypress="if(event.key==='Enter') sendCommand()">
        <button id="manual-mic" onclick="startManualVoice()" class="px-3.5 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl text-slate-300">
          🎙️
        </button>
        <button onclick="sendCommand()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2 rounded-xl text-sm transition">
          ابعث
        </button>
      </div>
    </div>
  </main>

  <script>
    let ttsEnabled = true;
    let wakeWordActive = false;
    let recognition = null;
    let isProcessing = false;

    function toggleTTS() {
      document.getElementById('tts-btn').innerText = ttsEnabled ? '🔊' : '🔇';
    }

    function speakResponse(text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ar-XA';
      utter.rate = 1.05;
      window.speechSynthesis.speak(utter);
    }

    // Wake Word Engine (Hey Genio / يا جينيو / جينيو)
    function initSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = 'ar-TN';

      rec.onresult = (event) => {
        if (isProcessing) return;
        const lastResult = event.results[event.results.length - 1][0].transcript.trim();
        console.log("Heard:", lastResult);

        const lower = lastResult.toLowerCase();
        // Check Wake Word Triggers
        if (lower.includes("genio") || lower.includes("جينيو") || lower.includes("جنيو") || lower.includes("جونيور") || lower.includes("وينك")) {
          // Trigger visual feedback
          document.getElementById('chat-container').classList.add('jarvis-listening');
          document.getElementById('wake-status').innerText = '⚡ جينيو يسمع فيك توا...';
          
          // Clean prompt from wake word
          let cleanPrompt = lastResult
            .replace(/hey genio/gi, '')
            .replace(/يا جينيو/gi, '')
            .replace(/جينيو/gi, '')
            .replace(/جنيو/gi, '')
            .replace(/جونيور/gi, '')
            .replace(/وينك/gi, '')
            .trim();

          document.getElementById('prompt-input').value = cleanPrompt;
          sendCommand(cleanPrompt);
        } else if (wakeWordActive) {
          // Direct speech mode
          document.getElementById('prompt-input').value = lastResult;
          sendCommand(lastResult);
        }
      };

      rec.onerror = (e) => console.warn("Speech rec error:", e);
      rec.onend = () => {
        if (wakeWordActive) {
          try { rec.start(); } catch(e) {}
        }
      };
      return rec;
    }

    function toggleWakeWord() {

      const btn = document.getElementById('wake-toggle-btn');

      if (wakeWordActive) {
        btn.classList.remove('bg-cyan-950');
        btn.classList.add('bg-emerald-600', 'text-black');
        btn.innerText = '🟢 الاستماع نشط (ناديني)';
        try { recognition.start(); } catch(e) {}
      } else {
        btn.classList.remove('bg-emerald-600', 'text-black');
        btn.classList.add('bg-cyan-950', 'text-cyan-300');
        btn.innerText = '🎙️ استيقاظ: Hey Genio';
        try { recognition.stop(); } catch(e) {}
      }
    }

    function startManualVoice() {
      try { recognition.start(); } catch(e) {}
      document.getElementById('wake-status').innerText = '🎙️ تفضل احكي...';
    }

    async function sendCommand(customText) {
      const input = document.getElementById('prompt-input');
      const val = customText || input.value.trim();

      isProcessing = true;
      const chat = document.getElementById('chat-stream');
      chat.innerHTML += `
        <div class="hud-card p-3 rounded-xl border-r-4 border-slate-400 text-left" dir="ltr">
          <span class="text-[10px] text-slate-400 mono">[OPERATOR]</span>
          <p class="text-sm mt-1 text-slate-100">${val}</p>
        </div>`;
      
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: val })
        });
        const data = await res.json();
        const reply = data.reply;
        
        chat.innerHTML += `
          <div class="hud-card p-3.5 rounded-xl border-l-4 border-emerald-400">
            <span class="text-[10px] text-emerald-400 mono">[GENIO]</span>
            <p class="text-sm mt-1 text-slate-200 leading-relaxed">${reply}</p>
          </div>`;
        chat.scrollTop = chat.scrollHeight;
        
        speakResponse(reply);
      } catch (err) {
        console.error(err);
      } finally {
        isProcessing = false;
        document.getElementById('chat-container').classList.remove('jarvis-listening');
        document.getElementById('wake-status').innerText = 'قل: 'Hey Genio' أو 'يا جينيو'';
      }
    }
  </script>
</body>
</html>
