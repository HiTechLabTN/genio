name: Build and Release Genio Universal Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 & Node.js
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Multi-Platform Release Assets
        run: |
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/release_dist/*
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name || 'main' }}
          name: "Genio Universal Release ${{ github.ref_name || 'main' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
