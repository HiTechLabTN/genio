name: Build and Release Genio Universal Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Assets
        run: |
          mkdir -p dist
          cp -r web/* dist/

      - name: Package Linux Bundle
        run: |
          # ننشئ الأرشيف في مجلد مؤقت لتفادي خطأ file changed
          tar -czvf /tmp/genio-web-linux-bundle.tar.gz -C dist .
          mv /tmp/genio-web-linux-bundle.tar.gz dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
