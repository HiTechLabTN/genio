name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiosqlite psutil fastapi uvicorn httpx pytest pytest-asyncio loguru
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run backend tests
        env:
          GENIO_ENV: dev
          GENIO_ALLOW_SUDO: "0"
          GENIO_GENERIC_HEAL: "1"
          GENIO_TOOL_FORGE: "1"
        run: |
          pytest test_bash_tool_safety.py test_phase1_memory_agent.py test_phase2_session_checkpoint.py test_phase3_generic_healer.py test_phase4_tool_forge.py test_phase5_sandbox.py test_phase6_tolerant_ws.py test_phase7_routing_kill.py test_dataset_synthesizer.py test_motion_storyboard.py -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genio_client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: genio_client/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build || npm run build:client || echo "no build script"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Bash safety audit
        run: |
          python -m pytest test_bash_tool_safety.py -v
      - name: Check GENIO_ENV guard
        run: |
          GENIO_ENV=prod GENIO_API_KEY= python -c "import genio_server.server.main" && echo "should have failed" && exit 1 || echo "prod guard OK"
