name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Phase 23 : aucun opérateur masquant (|| true / || echo / warnings-only)
# n'est autorisé dans ce pipeline. Tout échec critique fait échouer le CI.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ruff (blocking)
        run: |
          pip install ruff -q
          python -m ruff check genio_server/ core/ config.py tests/test_*.py test_*.py

  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Unit + security + sandbox tests
        env:
          GENIO_ENV: dev
          GENIO_ALLOW_SUDO: "0"
          GENIO_GENERIC_HEAL: "1"
          GENIO_TOOL_FORGE: "1"
        run: |
          python -m pytest tests/ test_bash_tool_safety.py test_phase1_memory_agent.py test_phase2_session_checkpoint.py test_phase3_generic_healer.py test_phase4_tool_forge.py test_phase5_sandbox.py test_phase6_tolerant_ws.py test_phase7_routing_kill.py test_phase_A_tool_forge_rce.py test_phase_B_tool_forge_container.py test_phase_C_session_volume.py test_phase_D_container_lifecycle.py test_phase_E_model_routing.py test_dataset_synthesizer.py test_motion_storyboard.py -q
      - name: Env-dependent suites (explicit deselects, documented)
        # 2 known failures in legacy test_genio_core (module
        # genio_executive_core, API OllamaConfig driftée + services down).
        # Deselects nominatifs ici — jamais silencieux, jamais masqués.
        # Suivi : GENIO_FEATURE_MATRIX.md (legacy, hors runtime souverain).
        run: |
          python -m pytest test_genio_core.py -q --deselect test_genio_core.py::TestPlanning::test_parse_plan_injects_auditor --deselect test_genio_core.py::TestEndToEndDryRun::test_pipeline_dispatch
      - name: Lockfile consistency
        run: |
          python -m pytest tests/test_dependency_audit.py -q

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: genio_client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genio_client/package-lock.json
      - name: Install frontend deps (locked)
        run: npm ci
      - name: Typecheck (blocking)
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npx vitest run
      - name: Audit runtime deps (high/critical fail)
        run: |
          npm audit --omit=dev --audit-level=high
      - name: Build (blocking)
        run: npm run build
      - name: Smoke static bundle
        run: |
          test -f dist/index.html
          test -f dist/sw.js
