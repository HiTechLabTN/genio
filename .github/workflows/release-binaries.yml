# Build Binaries (EXE, DEB, APK) — hardened release workflow.
#
# Policy (no masking): required steps fail loudly. No `|| true`,
# no `|| echo ... continuing`, no `exit 0` on missing artifacts.
# Signing requires secrets; debug keystores are NEVER generated here
# (previous hardcoded `genio2026` debug signing removed — finding R-01).
# Unsigned artifacts are rejected, not uploaded silently.
name: Build Binaries (EXE, DEB, APK)

on:
  push:
    tags:
      - 'v*'
      - 'app-v*'
      - 'genio-android-v*'

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genio_client/package-lock.json
      - name: Install & Build Web (locked, deterministic)
        working-directory: genio_client
        run: |
          npm ci
          npm run build
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: genio_client/dist
          retention-days: 1

  build-electron:
    needs: build-web
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genio_client/package-lock.json
      - name: Install deps (locked)
        working-directory: genio_client
        run: npm ci
      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: genio_client/dist
      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: genio_client
        run: npm run electron:build:win
      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: genio_client
        run: npm run electron:build:linux
      - name: Validate build outputs (fail if empty)
        shell: bash
        run: |
          ls genio_client/release-builds/ | head -20
          count=$(ls genio_client/release-builds/ | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: electron build produced no artifacts"; exit 1
          fi
      - name: Checksum artifacts
        shell: bash
        run: |
          cd genio_client/release-builds && find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Derive version
        id: ver
        shell: bash
        run: |
          VER=$(node -p "require('./genio_client/package.json').version")
          echo "APP_VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"
      - name: Upload EXE to Release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            genio_client/release-builds/*.exe
            genio_client/release-builds/*.exe.blockmap
            genio_client/release-builds/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload DEB to Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            genio_client/release-builds/*.deb
            genio_client/release-builds/*.AppImage
            genio_client/release-builds/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genio_client/package-lock.json
      - name: Install deps (locked)
        working-directory: genio_client
        run: npm ci
      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: genio_client/dist
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' package was removed by Google (sdkmanager 404s) —
          # install only platform-tools here, NDK/platforms explicitly below.
          packages: 'platform-tools'
      - name: Setup Rust (for Tauri Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
      - name: Add Android platform (Capacitor)
        working-directory: genio_client
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Add Android platform (Tauri)
        working-directory: genio_client
        run: |
          npx tauri android init
          bash scripts/apply-android-cleartext.sh
      - name: Build APK (Tauri)
        working-directory: genio_client
        run: npx tauri android build --apk --target aarch64
      - name: Build AAB (Tauri)
        working-directory: genio_client
        run: |
          npx tauri android build --aab --target aarch64
          if [ -f "genio_client/android/gradlew" ]; then
            cd genio_client/android && chmod +x gradlew && ./gradlew bundleRelease
          fi
      - name: Validate APK/AAB outputs (fail if empty)
        run: |
          found=$(find genio_client -name "*.apk" -o -name "*.aab" 2>/dev/null | grep -v unaligned | head -20)
          if [ -z "$found" ]; then
            echo "ERROR: android build produced no APK/AAB"; exit 1
          fi
          echo "$found"
      - name: Sign APK (release keystore required)
        run: |
          set -e
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret not configured."
            echo "Refusing to upload unsigned APKs or to generate debug keys. Configure release signing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APK=$(find genio_client/src-tauri/gen/android genio_client/android -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -1)
          BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BT/zipalign" -f 4 "$APK" /tmp/genio-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" --ks-key-alias "${ANDROID_KEY_ALIAS:-genio}" \
            --out "${APK%-unsigned.apk}-release.apk" /tmp/genio-aligned.apk
          rm -f /tmp/release.keystore /tmp/genio-aligned.apk
          find genio_client -name "*.apk" | head -20
      - name: Checksum artifacts
        run: |
          find genio_client -name "*.apk" -o -name "*.aab" | grep -v unaligned > /tmp/apks.txt
          cat /tmp/apks.txt
          (cd genio_client && sha256sum $(cat /tmp/apks.txt | sed 's|genio_client/||') > ANDROID_SHA256SUMS.txt)
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            genio_client/src-tauri/gen/android/**/*.apk
            genio_client/android/app/build/outputs/apk/**/*.apk
            genio_client/android/**/*.apk
            genio_client/src-tauri/gen/android/**/*.aab
            genio_client/android/app/build/outputs/bundle/**/*.aab
            genio_client/android/**/*.aab
            genio_client/ANDROID_SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Upload Web Bundle to Release
        run: |
          cd genio_client
          zip -r ../Genio-Web-${{ github.ref_name }}.zip dist
          ls -lh ../Genio-Web-*.zip
          sha256sum ../Genio-Web-*.zip > ../Genio-Web-${{ github.ref_name }}.zip.sha256
      - name: Upload Web Bundle Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            Genio-Web-*.zip
            Genio-Web-*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
