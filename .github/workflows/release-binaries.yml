name: Build Binaries (EXE, DEB, APK)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install & Build Web
        working-directory: genio_client
        run: |
          npm install
          npm run build
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: genio_client/dist

  build-electron:
    needs: build-web
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        working-directory: genio_client
        run: npm install
      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: genio_client/dist
      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: genio_client
        run: npm run electron:build:win
      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: genio_client
        run: npm run electron:build:linux
      - name: Upload EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./genio_client/release-builds/Genio Setup 2.3.2.exe
          asset_name: Genio-Setup.exe
          asset_content_type: application/octet-stream
      - name: Upload DEB
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./genio_client/release-builds/genio-client_2.3.2_amd64.deb
          asset_name: genio_amd64.deb
          asset_content_type: application/octet-stream

  build-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        working-directory: genio_client
        run: npm install
      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: genio_client/dist
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Sync Capacitor
        working-directory: genio_client
        run: |
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd genio_client/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./genio_client/android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: Genio.apk
          asset_content_type: application/vnd.android.package-archive
